name: Daily Notion sync to RidersFanatics preproduction

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

concurrency:
  group: ridersfanatics-preproduction
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preproduction
    env:
      RF_BUILD_ENV: preprod
      RF_SITE_URL: https://preprod.ridersfanatics.com
      RF_SKIP_IMAGE_OPTIMIZER: "1"

    steps:
      - name: Check out the preproduction branch
        uses: actions/checkout@v4
        with:
          ref: preprod

      - name: Read and validate the 2026 Notion data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          test -n "$NOTION_TOKEN" || { echo "Add NOTION_TOKEN to the preproduction environment." >&2; exit 1; }
          python3 scripts/sync_notion.py
          python3 scripts/validate_rider_snapshot.py data/notion/riders.json

      - name: Compare with the Notion snapshot on OVH
        id: change
        env:
          PREPROD_BASIC_USER: ${{ secrets.PREPROD_BASIC_USER }}
          PREPROD_BASIC_PASSWORD: ${{ secrets.PREPROD_BASIC_PASSWORD }}
        run: |
          local_version="$(python3 -c 'import json; print(json.load(open("data/notion/sync-metadata.json"))["sha256"])')"
          remote_version="$(curl --fail --silent --show-error --user "$PREPROD_BASIC_USER:$PREPROD_BASIC_PASSWORD" https://preprod.ridersfanatics.com/notion-data-version.txt || true)"
          changed=true
          if test "$local_version" = "$remote_version"; then
            changed=false
            echo "No Notion data change; preproduction remains untouched."
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Build and test the protected preview
        if: steps.change.outputs.changed == 'true'
        run: |
          python3 build.py
          python3 tests/environment_visibility.py
          grep -q 'Disallow: /' robots.txt
          grep -q 'noindex,nofollow,noarchive' index.html
          deploy/build-preprod-variants.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/public" "$RUNNER_TEMP/source-variants"

      - name: Apply preproduction authentication
        if: steps.change.outputs.changed == 'true'
        env:
          PREPROD_AUTH_FILE: ${{ secrets.OVH_AUTH_FILE }}
        run: |
          test -n "$PREPROD_AUTH_FILE"
          sed -i "s|__PREPROD_AUTH_FILE__|$PREPROD_AUTH_FILE|g" "$RUNNER_TEMP/public/.htaccess"
          test -f "$RUNNER_TEMP/public/google/index.html"
          test -f "$RUNNER_TEMP/public/notion/index.html"
          test -f "$RUNNER_TEMP/public/notion-data-version.txt"
          grep -q '^notion=ready$' "$RUNNER_TEMP/public/data-source-status.txt"

      - name: Install publishing and authentication tools
        if: steps.change.outputs.changed == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp apache2-utils

      - name: Publish only to the separate OVH preproduction directory
        if: steps.change.outputs.changed == 'true'
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_REMOTE_DIR: ${{ secrets.OVH_REMOTE_DIR }}
          OVH_AUTH_FILE: ${{ secrets.OVH_AUTH_FILE }}
          PREPROD_BASIC_USER: ${{ secrets.PREPROD_BASIC_USER }}
          PREPROD_BASIC_PASSWORD: ${{ secrets.PREPROD_BASIC_PASSWORD }}
        run: |
          case "$OVH_REMOTE_DIR" in
            /home/ridersi/www|/home/ridersi/www/|/|"") echo "Unsafe preproduction directory" >&2; exit 2 ;;
          esac
          htpasswd -nbB "$PREPROD_BASIC_USER" "$PREPROD_BASIC_PASSWORD" > "$RUNNER_TEMP/preprod.htpasswd"
          lftp -u "$OVH_SFTP_USER,$OVH_SFTP_PASSWORD" \
            "sftp://$OVH_SFTP_HOST:$OVH_SFTP_PORT" \
            -e "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 20; put $RUNNER_TEMP/preprod.htpasswd -o $OVH_AUTH_FILE; mirror --reverse --delete --parallel=4 --verbose $RUNNER_TEMP/public $OVH_REMOTE_DIR; bye"

      - name: Verify the Notion preproduction preview
        if: steps.change.outputs.changed == 'true'
        env:
          PREPROD_BASIC_USER: ${{ secrets.PREPROD_BASIC_USER }}
          PREPROD_BASIC_PASSWORD: ${{ secrets.PREPROD_BASIC_PASSWORD }}
        run: |
          for attempt in {1..20}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://preprod.ridersfanatics.com/ || true)"
            test "$status" = "401" && break
            sleep 15
          done
          test "$status" = "401"
          status_text="$(curl --fail --silent --show-error --user "$PREPROD_BASIC_USER:$PREPROD_BASIC_PASSWORD" https://preprod.ridersfanatics.com/data-source-status.txt)"
          grep -q '^active=google$' <<< "$status_text"
          grep -q '^notion=ready$' <<< "$status_text"
          curl --fail --silent --show-error --user "$PREPROD_BASIC_USER:$PREPROD_BASIC_PASSWORD" https://preprod.ridersfanatics.com/notion/ | grep -q 'Notion'
