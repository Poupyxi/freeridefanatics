name: Sync Google Drive Logos

on:
  workflow_dispatch:
  schedule:
    # Offset from the main preproduction refresh to avoid competing for resources.
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: ridersfanatics-drive-logos
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_DRIVE_IMAGE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_IMAGE_FOLDER_ID }}

    steps:
      - name: Check out preproduction
        uses: actions/checkout@v4
        with:
          ref: preprod
          fetch-depth: 0

      - name: Install read-only Google Drive support
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-drive.txt
          python3 -m pip install --disable-pip-version-check pillow-avif-plugin==1.5.2

      - name: Synchronize and validate Drive logos
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_DRIVE_IMAGE_FOLDER_ID"
          test -n "$GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON"
          python3 scripts/sync_drive_logos.py
          python3 tests/drive_logo_sync.py

      - name: Detect logo changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- data/drive-logo-manifest.json assets/img/brands assets/img/competitions assets/img/teams \
             && test -z "$(git ls-files --others --exclude-standard data/drive-logo-manifest.json assets/img/brands assets/img/competitions assets/img/teams)"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Google Drive logo changed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit logo changes to preproduction
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git fetch origin preprod
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/preprod)" || {
            echo "Preproduction changed during logo synchronization; the next scheduled run will retry safely." >&2
            exit 1
          }
          git config user.name "RidersFanatics automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/drive-logo-manifest.json assets/img/brands assets/img/competitions assets/img/teams
          git commit -m "Sync Google Drive logos"
          git push origin HEAD:preprod

      - name: Ask the existing preproduction workflow to validate and publish
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-preprod-ovh.yml --ref preprod -f force_deploy=true
