services:

  freeride:
    build: .
    container_name: freeridefanatics
    restart: unless-stopped
    ports:
      - "5001:5000"          # VPS:5001 → container:5000 (nginx pointe sur 5001)
    volumes:
      # Données persistantes (montées depuis le VPS, jamais dans l'image)
      - ./PPRiders:/app/PPRiders
      - ./PPRIDERS:/app/PPRIDERS
      - ./PictureRiders:/app/PictureRiders
      - ./Equipment:/app/Equipment
      - ./output:/app/output
      - ./flags:/app/flags
      - ./logos:/app/logos
      - ./assets:/app/assets:ro
      # Credentials Google OAuth + Flask secret key
      - ./data:/data
    environment:
      - FLASK_ENV=production
      - CONFIG_DIR=/data          # l'app lit les tokens OAuth depuis /data
    networks:
      - hotcut

networks:
  hotcut:
    external: true              # réseau partagé entre tous les containers hotcut.xyz
