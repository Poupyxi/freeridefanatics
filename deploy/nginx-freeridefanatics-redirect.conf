# Keep this lightweight redirect online after the OVH migration so search
# engines and existing links transfer cleanly to the new canonical domain.
server {
    listen 80;
    listen [::]:80;
    server_name freeridefanatics.hotcut.xyz www.freeridefanatics.hotcut.xyz;
    return 301 https://ridersfanatics.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name freeridefanatics.hotcut.xyz www.freeridefanatics.hotcut.xyz;

    ssl_certificate /etc/letsencrypt/live/freeridefanatics.hotcut.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freeridefanatics.hotcut.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ridersfanatics.com$request_uri;
}
