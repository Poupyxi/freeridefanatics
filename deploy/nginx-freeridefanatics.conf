server {
    server_name freeridefanatics.hotcut.xyz www.freeridefanatics.hotcut.xyz;

    root /var/www/freeridefanatics-public;
    index index.html;
    charset utf-8;

    if ($host = www.freeridefanatics.hotcut.xyz) {
        return 301 https://freeridefanatics.hotcut.xyz$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /index.html {
        return 301 /;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 1h;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        expires 1h;
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        sub_filter_once off;
        sub_filter '"/assets/' '"/app-assets/';
    }

    location /app-assets/ {
        alias /opt/hotcut/freeridefanatics/assets/;
        expires 7d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logos/ {
        proxy_pass http://127.0.0.1:5001/logos/;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    listen [::]:443 ssl http2 ipv6only=on;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/freeridefanatics.hotcut.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freeridefanatics.hotcut.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name freeridefanatics.hotcut.xyz www.freeridefanatics.hotcut.xyz;
    return 301 https://freeridefanatics.hotcut.xyz$request_uri;
}
