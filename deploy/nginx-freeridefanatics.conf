server {
    server_name freeridefanatics.hotcut.xyz;

    root /var/www/freeridefanatics-public;
    index index.html;

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        sub_filter_once off;
        sub_filter '"/assets/' '"/app-assets/';
    }

    location /app-assets/ {
        alias /opt/hotcut/freeridefanatics/assets/;
        expires 7d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logos/ {
        proxy_pass http://127.0.0.1:5001/logos/;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/freeridefanatics.hotcut.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freeridefanatics.hotcut.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = freeridefanatics.hotcut.xyz) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name freeridefanatics.hotcut.xyz;
    return 404;
}
