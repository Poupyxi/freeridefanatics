# /etc/nginx/sites-available/freeridefanatics
# Après certbot : ce fichier sera modifié automatiquement pour HTTPS

server {
    listen 80;
    server_name freeridefanatics.hotcut.xyz;

    # Taille max upload (photos équipements, logos)
    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Fichiers statiques servis directement par nginx (optionnel, perf)
    location /static/ {
        alias /opt/hotcut/freeridefanatics/static/;
        expires 7d;
    }
}
