name: Audit Equipment Photos

on:
  workflow_dispatch:
    inputs:
      annotate_notion:
        description: Write only audit fields to Equipments (never changes product data)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ridersfanatics-equipment-photo-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Compare Notion equipment with Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preproduction
    env:
      GOOGLE_DRIVE_IMAGE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_IMAGE_FOLDER_ID }}
    steps:
      - name: Check out the preproduction data contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: preprod

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-drive.txt

      - name: Install read-only source clients
        run: python3 -m pip install --disable-pip-version-check -r requirements-drive.txt

      - name: Export the current Notion snapshot
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NOTION_TOKEN"
          python3 scripts/sync_notion.py
          test -s data/notion/riders.json

      - name: Download the current Google Drive image library
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          RF_IMAGE_LIBRARY: ${{ runner.temp }}/freeride-images
        run: |
          set -euo pipefail
          test -n "$GOOGLE_DRIVE_IMAGE_FOLDER_ID"
          test -n "$GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON"
          python3 scripts/sync_drive_images.py \
            --output "$RF_IMAGE_LIBRARY" \
            --manifest "$RUNNER_TEMP/drive-manifest.json"
          test -s "$RUNNER_TEMP/drive-manifest.json"

      - name: Audit every equipment relation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/equipment-photo-audit"
          python3 scripts/audit_equipment_photos.py \
            --riders data/notion/riders.json \
            --drive-library "$RUNNER_TEMP/freeride-images" \
            --drive-manifest "$RUNNER_TEMP/drive-manifest.json" \
            --output-json "$RUNNER_TEMP/equipment-photo-audit/audit.json" \
            --output-csv "$RUNNER_TEMP/equipment-photo-audit/audit.csv" \
            --output-markdown "$RUNNER_TEMP/equipment-photo-audit/audit.md"
          cat "$RUNNER_TEMP/equipment-photo-audit/audit.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the read-only audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: equipment-photo-audit
          path: ${{ runner.temp }}/equipment-photo-audit/
          retention-days: 30
          if-no-files-found: error

      - name: Annotate Notion audit fields
        if: inputs.annotate_notion == true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NOTION_TOKEN"
          python3 scripts/annotate_notion_equipment_photos.py \
            --audit-json "$RUNNER_TEMP/equipment-photo-audit/audit.json" \
            --token "$NOTION_TOKEN" \
            --apply
