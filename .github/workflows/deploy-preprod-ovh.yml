name: Update Notion Preprod

on:
  pull_request:
    branches: [preprod]
  push:
    branches: [preprod]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Force rebuilding and publishing preproduction
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      sync_scope:
        description: Isolated preproduction source to refresh
        required: false
        type: string
        default: notion
      force_deploy:
        description: Force rebuilding and publishing preproduction
        required: false
        type: boolean
        default: false
  schedule:
    # Schedules run from the default branch; always build the preprod branch.
    - cron: "*/15 * * * *"

concurrency:
  # Keep deployment runs serialized, while allowing unrelated pull requests to
  # validate independently. A newer commit only cancels the older run of the
  # same pull request.
  group: ${{ github.event_name == 'pull_request' && format('ridersfanatics-preproduction-pr-{0}', github.event.pull_request.number) || 'ridersfanatics-preproduction' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  preprod-change-validation:
    if: github.event_name == 'pull_request'
    name: Validate preproduction change
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RF_BUILD_ENV: preprod
      RF_DATA_SOURCE: notion
      RF_DATA_PATH: data/riders.json
      RF_COMPETITIONS_PATH: data/competitions.json
      RF_SITE_URL: https://preprod.ridersfanatics.com
      RF_SKIP_IMAGE_OPTIMIZER: "1"
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate without deployment credentials
        run: |
          set -euo pipefail
          python3 tests/notion_only_source.py
          python3 tests/result_status_logic.py
          python3 tests/rider_name_normalization.py
          python3 tests/seo_priority_content.py
          python3 tests/drive_image_sync.py
          python3 tests/deployment_delta.py
          python3 tests/deployment_health.py
          python3 tests/deployment_access_contract.py
          python3 tests/restore_snapshot.py
          python3 tests/notion_snapshot_freshness.py
          python3 tests/live_site_metadata.py
          python3 tests/workflow_contract.py
          python3 build.py
          test -s index.html
          test -s riders.html
          test -s equipment.html
          grep -q 'noindex,nofollow,noarchive' index.html
          grep -q 'Disallow: /' robots.txt

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: preproduction
    env:
      RF_BUILD_ENV: preprod
      RF_DATA_SOURCE: notion
      RF_DATA_PATH: data/notion/riders.json
      RF_COMPETITIONS_PATH: data/notion/competitions.json
      RF_SITE_URL: https://preprod.ridersfanatics.com
      RF_SKIP_IMAGE_OPTIMIZER: "1"
      GOOGLE_DRIVE_IMAGE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_IMAGE_FOLDER_ID }}
      RF_SYNC_SCOPE: ${{ inputs.sync_scope || 'notion' }}

    steps:
      - name: Check out the preproduction revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: preprod

      - name: Configure Python dependency cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-drive.txt
            requirements-frame-reveal.txt

      - name: Read and validate Notion
        if: env.RF_SYNC_SCOPE == 'notion'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NOTION_TOKEN" || { echo "NOTION_TOKEN is required." >&2; exit 1; }
          python3 scripts/sync_notion.py
          test -s data/notion/riders.json
          test -s data/notion/competitions.json
          test -s data/notion/sync-metadata.json
          python3 scripts/validate_rider_snapshot.py data/notion/riders.json
          python3 scripts/validate_notion_snapshot.py \
            --riders data/notion/riders.json \
            --metadata data/notion/sync-metadata.json \
            --max-age-hours 48
          python3 tests/notion_only_source.py
          python3 tests/result_status_logic.py
          python3 tests/rider_name_normalization.py
          python3 tests/seo_priority_content.py
          python3 tests/workflow_contract.py
          python3 tests/deployment_access_contract.py

      - name: Install read-only Google Drive image support
        if: env.RF_SYNC_SCOPE == 'drive'
        run: python3 -m pip install --disable-pip-version-check -r requirements-drive.txt

      - name: Inventory Google Drive without downloading images
        if: env.RF_SYNC_SCOPE == 'drive'
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          RF_IMAGE_LIBRARY: ${{ runner.temp }}/freeride-image-inventory
        run: |
          set -euo pipefail
          test -n "$GOOGLE_DRIVE_IMAGE_FOLDER_ID"
          test -n "$GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON"
          python3 scripts/sync_drive_images.py \
            --output "$RF_IMAGE_LIBRARY" \
            --manifest "$RUNNER_TEMP/drive-inventory.json" \
            --source-version data/drive/live-drive-source-version.txt \
            --inventory-only
          test -s data/drive/live-drive-source-version.txt

      - name: Compare source inventories with the protected preview
        id: change
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy || false }}
          PREPROD_BASIC_USER: ${{ secrets.PREPROD_BASIC_USER }}
          PREPROD_BASIC_PASSWORD: ${{ secrets.PREPROD_BASIC_PASSWORD }}
        run: |
          set -euo pipefail
          case "$RF_SYNC_SCOPE" in
            notion)
              local_version="$(python3 -c 'import hashlib, pathlib; h=hashlib.sha256(); [h.update(pathlib.Path(p).read_bytes()) for p in ("data/notion/riders.json", "data/notion/competitions.json")]; print(h.hexdigest())')"
              remote_version_url="https://preprod.ridersfanatics.com/notion-data-version.txt"
              ;;
            drive)
              local_version="$(cat data/drive/live-drive-source-version.txt)"
              remote_version_url="https://preprod.ridersfanatics.com/drive-source-version.txt"
              ;;
            *)
              echo "Unsupported isolated sync scope: $RF_SYNC_SCOPE" >&2
              exit 2
              ;;
          esac
          test -n "$local_version"

          if test "$GITHUB_EVENT_NAME" = "push"; then
            echo "A preprod code change requires a Notion-based rebuild."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if test "$FORCE_DEPLOY" = "true"; then
            echo "Forced $RF_SYNC_SCOPE refresh requested."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -n "$PREPROD_BASIC_USER" && test -n "$PREPROD_BASIC_PASSWORD"
          remote_version="$(curl --fail --silent --show-error --retry 2 \
            --user "$PREPROD_BASIC_USER:$PREPROD_BASIC_PASSWORD" \
            "$remote_version_url" || true)"
          if test "$local_version" = "$remote_version"; then
            echo "No $RF_SYNC_SCOPE source change; skipping deployment."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$RF_SYNC_SCOPE changed, or no published receipt is available."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate the latest complete preproduction snapshot
        if: steps.change.outputs.changed == 'true'
        id: previous_snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=""
          candidates="$(gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=validated-preproduction-snapshot&per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .workflow_run.id')"
          while IFS= read -r candidate; do
            test -n "$candidate" || continue
            eligible="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$candidate" \
              --jq 'select(.conclusion == "success" and (.event == "push" or .event == "schedule" or .event == "workflow_dispatch") and (.path == ".github/workflows/deploy-preprod-ovh.yml" or .path == ".github/workflows/deploy-preprod-drive-ovh.yml")) | .id')"
            if test -n "$eligible"; then
              run_id="$candidate"
              break
            fi
          done <<< "$candidates"
          test -n "$run_id" || {
            echo "No complete validated preproduction snapshot is available." >&2
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Load the unchanged source from the validated snapshot
        if: steps.change.outputs.changed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-preproduction-snapshot
          path: ${{ runner.temp }}/previous-preproduction-snapshot
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_snapshot.outputs.run_id }}

      - name: Restore only the unchanged source
        if: steps.change.outputs.changed == 'true'
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/previous-preproduction-snapshot/validated-preproduction-snapshot.tar"
          test -s "$snapshot"
          case "$RF_SYNC_SCOPE" in
            notion)
              rm -rf \
                assets/img/drive-library \
                assets/img/riders \
                assets/img/riders-action \
                assets/img/equipment \
                assets/img/brands \
                assets/img/competitions \
                assets/img/teams
              tar -xf "$snapshot" -C "$GITHUB_WORKSPACE" \
                data/drive/live-image-manifest.json \
                data/drive/live-images-version.txt \
                data/drive/live-drive-source-version.txt \
                data/drive-logo-manifest.json \
                assets/img/drive-library \
                assets/img/riders \
                assets/img/riders-action \
                assets/img/equipment \
                assets/img/brands \
                assets/img/competitions \
                assets/img/teams
              ;;
            drive)
              rm -rf data/notion
              tar -xf "$snapshot" -C "$GITHUB_WORKSPACE" data/notion
              ;;
          esac

      - name: Install frame animation support
        # The shared category and reveal validation imports Pillow even when
        # Drive itself is restored unchanged during a Notion-only refresh.
        if: steps.change.outputs.changed == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-frame-reveal.txt
          python3 -m pip install --disable-pip-version-check "Pillow==12.3.0"

      - name: Synchronize Google Drive images
        if: steps.change.outputs.changed == 'true' && env.RF_SYNC_SCOPE == 'drive'
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          RF_IMAGE_LIBRARY: ${{ runner.temp }}/freeride-images
        run: |
          set -euo pipefail
          test -n "$GOOGLE_DRIVE_IMAGE_FOLDER_ID"
          test -n "$GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON"
          python3 scripts/sync_drive_images.py \
            --output "$RF_IMAGE_LIBRARY" \
            --manifest data/drive/live-image-manifest.json \
            --source-version data/drive/live-drive-source-version.txt \
            --public-mirror assets/img/drive-library
          python3 tests/drive_image_sync.py
          python3 scripts/sync_drive_logos.py --source-directory "$RF_IMAGE_LIBRARY"
          python3 tests/drive_logo_sync.py
          python3 import_images.py --force --no-build
          python3 tests/equipment_category_mapping.py
          python3 tests/frame_reveal_assets.py

      - name: Validate the combined Notion and Drive snapshot
        if: steps.change.outputs.changed == 'true'
        run: |
          set -euo pipefail
          test -s data/notion/riders.json
          test -s data/notion/competitions.json
          test -s data/notion/sync-metadata.json
          test -s data/drive/live-image-manifest.json
          test -s data/drive/live-drive-source-version.txt
          test -s data/drive-logo-manifest.json
          python3 scripts/validate_rider_snapshot.py data/notion/riders.json
          python3 scripts/validate_notion_snapshot.py \
            --riders data/notion/riders.json \
            --metadata data/notion/sync-metadata.json \
            --max-age-hours 48
          python3 tests/notion_only_source.py
          python3 tests/result_status_logic.py
          python3 tests/rider_name_normalization.py
          python3 tests/drive_image_sync.py
          python3 tests/drive_logo_sync.py
          python3 tests/equipment_category_mapping.py
          python3 tests/frame_reveal_assets.py
          python3 scripts/image_snapshot_hash.py \
            assets/img/drive-library assets/img/riders assets/img/riders-action assets/img/equipment \
            assets/img/brands assets/img/competitions assets/img/teams \
            > data/drive/live-images-version.txt
          python3 scripts/deployment_health.py create \
            --riders data/notion/riders.json \
            --drive-manifest data/drive/live-image-manifest.json \
            --public-image-path assets/img/riders \
            --public-image-path assets/img/riders-action \
            --public-image-path assets/img/equipment \
            --public-image-path assets/img/brands \
            --public-image-path assets/img/competitions \
            --public-image-path assets/img/teams \
            --output data/deployment-health.json
          python3 tests/deployment_health.py
          test -s data/drive/live-image-manifest.json
          test -s data/drive/live-images-version.txt
          test -s data/deployment-health.json

      - name: Keep the validated Notion snapshot for diagnostics
        if: steps.change.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notion-preproduction-snapshot
          path: data/notion/
          retention-days: 1

      - name: Package the validated preproduction snapshot
        if: steps.change.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/validated-source-sha.txt"
          tar -cf "$RUNNER_TEMP/validated-preproduction-snapshot.tar" \
            data/notion \
            data/drive/live-image-manifest.json \
            data/drive/live-images-version.txt \
            data/drive/live-drive-source-version.txt \
            data/drive-logo-manifest.json \
            data/deployment-health.json \
            assets/img/drive-library \
            assets/img/riders \
            assets/img/riders-action \
            assets/img/equipment \
            assets/img/brands \
            assets/img/competitions \
            assets/img/teams \
            -C "$RUNNER_TEMP" validated-source-sha.txt
          test -s "$RUNNER_TEMP/validated-preproduction-snapshot.tar"

      - name: Build and test the protected preview
        if: steps.change.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 build.py
          python3 tests/environment_visibility.py
          grep -q 'Disallow: /' robots.txt
          grep -q 'noindex,nofollow,noarchive' index.html
          ! grep -q 'preprod-source-switcher' index.html
          ! grep -q 'Google Sheets' index.html
          test -f riders/finn-iles.html
          test -f competitions/project-17.html
          test -f competitions/project-17/riders.html
          grep -q 'data-rider-grid' competitions/project-17/riders.html
          test -f competitions/uci-mtb-world-cup-dh-2026.html
          test -f competitions/uci-mtb-world-cup-dh-2026/rounds/les-gets.html
          test -f competitions/uci-mtb-world-cup-dh-2026/rounds/whistler.html
          test -f competitions/uci-mtb-world-cup-dh-2026/rounds/lake-placid.html
          grep -Eq 'Coming soon|data-standing-row' competitions/uci-mtb-world-cup-dh-2026/rounds/lake-placid.html

      - name: Prepare isolated public files
        if: steps.change.outputs.changed == 'true'
        env:
          PREPROD_AUTH_FILE: ${{ secrets.OVH_AUTH_FILE }}
        run: |
          set -euo pipefail
          test -n "$PREPROD_AUTH_FILE"
          mkdir -p "$RUNNER_TEMP/public"
          deploy/publish-static.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/public" preprod
          cp data/notion/sync-metadata.json "$RUNNER_TEMP/public/notion-sync-metadata.json"
          python3 -c 'import hashlib, pathlib; h=hashlib.sha256(); [h.update(pathlib.Path(p).read_bytes()) for p in ("data/notion/riders.json", "data/notion/competitions.json")]; print(h.hexdigest())' \
            > "$RUNNER_TEMP/public/notion-data-version.txt"
          cp data/drive/live-images-version.txt "$RUNNER_TEMP/public/drive-images-version.txt"
          cp data/drive/live-drive-source-version.txt "$RUNNER_TEMP/public/drive-source-version.txt"
          cp data/deployment-health.json "$RUNNER_TEMP/public/deployment-health.json"
          git rev-parse HEAD > "$RUNNER_TEMP/public/deployment-source-sha.txt"
          printf 'profile_data_source=notion-only\nimage_source=google-drive-only\n' \
            > "$RUNNER_TEMP/public/data-source-status.txt"
          sed -i "s|__PREPROD_AUTH_FILE__|$PREPROD_AUTH_FILE|g" "$RUNNER_TEMP/public/.htaccess"

          test -s "$RUNNER_TEMP/public/notion-sync-metadata.json"
          test -s "$RUNNER_TEMP/public/notion-data-version.txt"
          test -s "$RUNNER_TEMP/public/drive-images-version.txt"
          test -s "$RUNNER_TEMP/public/drive-source-version.txt"
          test -s "$RUNNER_TEMP/public/deployment-health.json"
          test -s "$RUNNER_TEMP/public/deployment-source-sha.txt"
          test -s "$RUNNER_TEMP/public/data-source-status.txt"
          test -f "$RUNNER_TEMP/public/competitions/project-17/riders.html"
          grep -q 'data-rider-grid' "$RUNNER_TEMP/public/competitions/project-17/riders.html"
          grep -q 'class="rider-card reveal"' "$RUNNER_TEMP/public/competitions/project-17/riders.html"
          test -f "$RUNNER_TEMP/public/assets/img/riders/bragg-cami-drive.jpg"
          grep -q 'assets/img/riders/bragg-cami-drive.jpg' "$RUNNER_TEMP/public/riders/bragg-cami.html"
          test -f "$RUNNER_TEMP/public/assets/img/equipment/frame-forbidden-supernought.jpg"
          grep -q 'assets/img/equipment/frame-forbidden-supernought.jpg' "$RUNNER_TEMP/public/riders/bragg-cami.html"
          test -f "$RUNNER_TEMP/public/assets/img/equipment/reveal/frame-forbidden-supernought-sketch.png"
          test -f "$RUNNER_TEMP/public/assets/img/equipment/reveal/frame-forbidden-supernought-draw.svg"
          grep -q 'data-frame-reveal' "$RUNNER_TEMP/public/riders/bragg-cami.html"
          grep -q 'frame-forbidden-supernought-draw.svg' "$RUNNER_TEMP/public/riders/bragg-cami.html"
          grep -q 'data-rider-feedback' "$RUNNER_TEMP/public/riders/bragg-cami.html"
          grep -q 'frame-src https://docs.google.com' "$RUNNER_TEMP/public/.htaccess"
          grep -q 'competition-season-meta' "$RUNNER_TEMP/public/competitions/project-17.html"
          grep -q 'Instagram <strong>@' "$RUNNER_TEMP/public/competitions/project-17.html"
          ! grep -q 'preprod-source-switcher' "$RUNNER_TEMP/public/index.html"
          ! grep -q 'Google Sheets' "$RUNNER_TEMP/public/index.html"
          ! test -f "$RUNNER_TEMP/public/contact-submit.php"
          ! test -d "$RUNNER_TEMP/public/google"
          ! test -d "$RUNNER_TEMP/public/notion"
          ! test -d "$RUNNER_TEMP/public/.git"
          ! test -d "$RUNNER_TEMP/public/tests"
          ! test -d "$RUNNER_TEMP/public/scripts"

      - name: Install publishing and authentication tools
        if: steps.change.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp apache2-utils

      - name: Prepare content-addressed upload delta
        if: steps.change.outputs.changed == 'true'
        id: delta
        env:
          PREPROD_BASIC_USER: ${{ secrets.PREPROD_BASIC_USER }}
          PREPROD_BASIC_PASSWORD: ${{ secrets.PREPROD_BASIC_PASSWORD }}
        run: |
          set -euo pipefail
          remote_manifest="$RUNNER_TEMP/remote-deployment-manifest.json"
          if ! curl --fail --silent --show-error \
            --user "$PREPROD_BASIC_USER:$PREPROD_BASIC_PASSWORD" \
            "https://preprod.ridersfanatics.com/deployment-manifest.json?run=$GITHUB_RUN_ID" \
            --output "$remote_manifest"; then
            printf '{"version":1,"files":{}}\n' > "$remote_manifest"
          fi
          python3 deploy/prepare-delta.py \
            --public "$RUNNER_TEMP/public" \
            --remote-manifest "$remote_manifest" \
            --delta "$RUNNER_TEMP/upload-delta" \
            --delete-script "$RUNNER_TEMP/delete-remote.lftp" \
            --github-output "$GITHUB_OUTPUT"
          python3 tests/deployment_delta.py

      - name: Publish only to the OVH preproduction directory
        if: steps.change.outputs.changed == 'true'
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_REMOTE_DIR: ${{ secrets.OVH_REMOTE_DIR }}
          OVH_AUTH_FILE: ${{ secrets.OVH_AUTH_FILE }}
          OVH_SFTP_KNOWN_HOSTS: ${{ secrets.OVH_SFTP_KNOWN_HOSTS }}
          PREPROD_BASIC_USER: ${{ secrets.PREPROD_BASIC_USER }}
          PREPROD_BASIC_PASSWORD: ${{ secrets.PREPROD_BASIC_PASSWORD }}
        run: |
          set -euo pipefail
          case "$OVH_REMOTE_DIR" in
            /home/ridersi/www|/home/ridersi/www/|/|"")
              echo "Unsafe preproduction directory: $OVH_REMOTE_DIR" >&2
              exit 2
              ;;
          esac
          test -n "$OVH_SFTP_HOST" && test -n "$OVH_SFTP_PORT"
          test -n "$OVH_SFTP_USER" && test -n "$OVH_SFTP_PASSWORD"
          test -n "$OVH_AUTH_FILE"
          test -n "$PREPROD_BASIC_USER" && test -n "$PREPROD_BASIC_PASSWORD"
          sftp_auto_confirm=yes
          if test -n "$OVH_SFTP_KNOWN_HOSTS"; then
            mkdir -p "$HOME/.ssh"
            printf '%s\n' "$OVH_SFTP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 700 "$HOME/.ssh"
            chmod 600 "$HOME/.ssh/known_hosts"
            sftp_auto_confirm=no
          else
            echo "::warning::OVH_SFTP_KNOWN_HOSTS is not configured; host-key auto-confirm remains enabled."
          fi
          htpasswd -nbB "$PREPROD_BASIC_USER" "$PREPROD_BASIC_PASSWORD" > "$RUNNER_TEMP/preprod.htpasswd"
          lftp -u "$OVH_SFTP_USER,$OVH_SFTP_PASSWORD" \
            "sftp://$OVH_SFTP_HOST:$OVH_SFTP_PORT" <<LFTP
          set cmd:fail-exit yes
          set sftp:auto-confirm $sftp_auto_confirm
          set net:max-retries 3
          set net:timeout 20
          put "$RUNNER_TEMP/preprod.htpasswd" -o "$OVH_AUTH_FILE"
          cd "$OVH_REMOTE_DIR"
          mirror --reverse --parallel=4 --verbose "$RUNNER_TEMP/upload-delta" .
          source "$RUNNER_TEMP/delete-remote.lftp"
          put "$RUNNER_TEMP/public/deployment-manifest.json" -o deployment-manifest.json
          bye
          LFTP

      - name: Verify preproduction protection and content
        if: steps.change.outputs.changed == 'true'
        env:
          PREPROD_BASIC_USER: ${{ secrets.PREPROD_BASIC_USER }}
          PREPROD_BASIC_PASSWORD: ${{ secrets.PREPROD_BASIC_PASSWORD }}
        run: |
          set -euo pipefail
          ready=0
          for attempt in {1..20}; do
            status_code="$(curl --silent --output /dev/null --write-out '%{http_code}' https://preprod.ridersfanatics.com/ || true)"
            if test "$status_code" = "401"; then
              ready=1
              break
            fi
            sleep 15
          done
          test "$ready" = "1"

          auth=(--user "$PREPROD_BASIC_USER:$PREPROD_BASIC_PASSWORD")
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${auth[@]}" https://preprod.ridersfanatics.com/)" = "200"
          curl --fail --silent --show-error "${auth[@]}" https://preprod.ridersfanatics.com/assets/i18n/fr.json > /dev/null
          curl --fail --silent --show-error "${auth[@]}" https://preprod.ridersfanatics.com/notion-data-version.txt > /dev/null
          curl --fail --silent --show-error "${auth[@]}" https://preprod.ridersfanatics.com/drive-images-version.txt > /dev/null
          curl --fail --silent --show-error "${auth[@]}" https://preprod.ridersfanatics.com/drive-source-version.txt > /dev/null
          curl --fail --silent --show-error "${auth[@]}" \
            https://preprod.ridersfanatics.com/deployment-health.json | grep -q '"riders"'
          curl --fail --silent --show-error "${auth[@]}" \
            "https://preprod.ridersfanatics.com/deployment-manifest.json?run=$GITHUB_RUN_ID" | grep -q '"version":1'
          test "$(curl --fail --silent --show-error "${auth[@]}" https://preprod.ridersfanatics.com/deployment-source-sha.txt)" = "$(git rev-parse HEAD)"
          curl --fail --silent --show-error "${auth[@]}" \
            https://preprod.ridersfanatics.com/notion-sync-metadata.json \
            --output "$RUNNER_TEMP/live-notion-sync-metadata.json"
          grep -q '"sha256"' "$RUNNER_TEMP/live-notion-sync-metadata.json"
          source_status="$(curl --fail --silent --show-error "${auth[@]}" https://preprod.ridersfanatics.com/data-source-status.txt)"
          grep -q '^profile_data_source=notion-only$' <<< "$source_status"
          grep -q '^image_source=google-drive-only$' <<< "$source_status"
          index_html="$(curl --fail --silent --show-error "${auth[@]}" https://preprod.ridersfanatics.com/)"
          printf '%s' "$index_html" > "$RUNNER_TEMP/live-index.html"
          python3 scripts/verify_live_site_metadata.py \
            --html "$RUNNER_TEMP/live-index.html" \
            --metadata "$RUNNER_TEMP/live-notion-sync-metadata.json"
          ! grep -q 'preprod-source-switcher' <<< "$index_html"

          ! grep -q 'Google Sheets' <<< "$index_html"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${auth[@]}" https://preprod.ridersfanatics.com/google/)" = "404"
          curl --fail --silent --show-error "${auth[@]}" https://preprod.ridersfanatics.com/assets/img/riders/bragg-cami-drive.jpg > /dev/null
          project_riders_html="$(curl --fail --silent --show-error "${auth[@]}" https://preprod.ridersfanatics.com/competitions/project-17/riders.html)"
          grep -q 'data-rider-grid' <<< "$project_riders_html"
          grep -q 'class="rider-card reveal"' <<< "$project_riders_html"
          curl --fail --silent --show-error "${auth[@]}" https://preprod.ridersfanatics.com/competitions/uci-mtb-world-cup-dh-2026/rounds/les-gets.html > /dev/null
          curl --fail --silent --show-error "${auth[@]}" https://preprod.ridersfanatics.com/competitions/uci-mtb-world-cup-dh-2026/rounds/whistler.html > /dev/null
          lake_placid_html="$(curl --fail --silent --show-error "${auth[@]}" https://preprod.ridersfanatics.com/competitions/uci-mtb-world-cup-dh-2026/rounds/lake-placid.html)"
          grep -Eq 'Coming soon|data-standing-row' <<< "$lake_placid_html"
          uci_page="$(curl --fail --silent --show-error "${auth[@]}" https://preprod.ridersfanatics.com/competitions/uci-mtb-world-cup-dh-2026.html)"
          grep -q 'uci-events-banner' <<< "$uci_page"
          grep -q 'uci-iconic-tour.js?v=9' <<< "$uci_page"
          ! grep -qi 'Recorded events' <<< "$uci_page"
          tour_script="$(curl --fail --silent --show-error "${auth[@]}" 'https://preprod.ridersfanatics.com/assets/js/uci-iconic-tour.js?v=9')"
          grep -q "'/competitions/uci-mtb-world-cup-dh-2026/rounds/mona-yongpyong.html'" <<< "$tour_script"
          grep -q "'/competitions/uci-mtb-world-cup-dh-2026/rounds/loudenvielle.html'" <<< "$tour_script"
          grep -q "'/competitions/uci-mtb-world-cup-dh-2026/rounds/leogang.html'" <<< "$tour_script"
          grep -q "'/competitions/uci-mtb-world-cup-dh-2026/rounds/lenzerheide.html'" <<< "$tour_script"
          grep -q "'/competitions/uci-mtb-world-cup-dh-2026/rounds/la-thuile.html'" <<< "$tour_script"
          grep -q "'/competitions/uci-mtb-world-cup-dh-2026/rounds/pal-arinsal.html'" <<< "$tour_script"
          grep -q "'/competitions/uci-mtb-world-cup-dh-2026/rounds/les-gets.html'" <<< "$tour_script"
          grep -q "'/competitions/uci-mtb-world-cup-dh-2026/rounds/lake-placid.html'" <<< "$tour_script"
          curl --silent --show-error "${auth[@]}" --head https://preprod.ridersfanatics.com/ | grep -qi '^x-robots-tag: noindex, nofollow, noarchive'

      - name: Keep the validated preproduction snapshot for promotion
        if: steps.change.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-preproduction-snapshot
          path: ${{ runner.temp }}/validated-preproduction-snapshot.tar
          # Both isolated refreshes need the other source as their stable base.
          retention-days: 30
          compression-level: 0
