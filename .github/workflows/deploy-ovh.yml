name: Preprod to Prod

on:
  workflow_dispatch:

concurrency:
  group: ridersfanatics-production
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate-preprod:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: preproduction
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      preprod_run_id: ${{ steps.preprod_run.outputs.run_id }}
    env:
      RF_DATA_SOURCE: notion
      RF_DATA_PATH: data/notion/riders.json
      RF_COMPETITIONS_PATH: data/notion/competitions.json
      GOOGLE_DRIVE_IMAGE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_IMAGE_FOLDER_ID }}

    steps:
      - name: Check out the preproduction revision
        uses: actions/checkout@v4
        with:
          ref: preprod

      - name: Record the exact preproduction revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Locate the latest successful preproduction snapshot
        id: preprod_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-preprod-ovh.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          test -n "$run_id" || { echo "No successful preproduction run is available." >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Load the snapshot already validated in preproduction
        uses: actions/download-artifact@v4
        with:
          name: validated-preproduction-snapshot
          path: ${{ runner.temp }}/validated-preproduction-snapshot
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.preprod_run.outputs.run_id }}

      - name: Restore the snapshot already validated in preproduction
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/validated-preproduction-snapshot/validated-preproduction-snapshot.tar"
          test -s "$snapshot"
          rm -rf \
            data/notion \
            assets/img/drive-library \
            assets/img/riders \
            assets/img/riders-action \
            assets/img/equipment \
            assets/img/brands \
            assets/img/competitions \
            assets/img/teams
          tar -xf "$snapshot" -C "$GITHUB_WORKSPACE"
          cp "$GITHUB_WORKSPACE/validated-source-sha.txt" "$RUNNER_TEMP/validated-source-sha.txt"

      - name: Confirm this revision and data are live in preproduction
        env:
          PREPROD_BASIC_USER: ${{ secrets.PREPROD_BASIC_USER }}
          PREPROD_BASIC_PASSWORD: ${{ secrets.PREPROD_BASIC_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PREPROD_BASIC_USER" && test -n "$PREPROD_BASIC_PASSWORD"

          local_source="$(cat "$RUNNER_TEMP/validated-source-sha.txt")"
          test "$local_source" = "$(git rev-parse HEAD)" || {
            echo "The latest successful preproduction snapshot does not match the current preprod branch." >&2
            echo "Run Update Preprod successfully before promoting again." >&2
            exit 1
          }
          live_source="$(curl --fail --silent --show-error --retry 3 \
            --user "$PREPROD_BASIC_USER:$PREPROD_BASIC_PASSWORD" \
            https://preprod.ridersfanatics.com/deployment-source-sha.txt)"
          test "$local_source" = "$live_source" || {
            echo "Preproduction is not currently serving revision $local_source." >&2
            echo "Published revision: $live_source" >&2
            exit 1
          }

          local_version="$(python3 -c 'import hashlib, pathlib; h=hashlib.sha256(); [h.update(pathlib.Path(p).read_bytes()) for p in ("data/notion/riders.json", "data/notion/competitions.json")]; print(h.hexdigest())')"
          live_version="$(curl --fail --silent --show-error --retry 3 \
            --user "$PREPROD_BASIC_USER:$PREPROD_BASIC_PASSWORD" \
            https://preprod.ridersfanatics.com/notion-data-version.txt)"
          test "$local_version" = "$live_version" || {
            echo "The current Notion snapshot has not yet been validated in preproduction." >&2
            echo "Wait for the preproduction action, then retry this promotion." >&2
            exit 1
          }

          local_images_version="$(cat data/drive/live-images-version.txt)"
          live_images_version="$(curl --fail --silent --show-error --retry 3 \
            --user "$PREPROD_BASIC_USER:$PREPROD_BASIC_PASSWORD" \
            https://preprod.ridersfanatics.com/drive-images-version.txt)"
          test "$local_images_version" = "$live_images_version" || {
            echo "The current Google Drive images have not yet been validated in preproduction." >&2
            echo "Wait for the preproduction action, then retry this promotion." >&2
            exit 1
          }

  deploy:
    needs: validate-preprod
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      RF_BUILD_ENV: production
      RF_DATA_SOURCE: notion
      RF_DATA_PATH: data/notion/riders.json
      RF_COMPETITIONS_PATH: data/notion/competitions.json
      RF_SITE_URL: https://ridersfanatics.com
      RF_SKIP_IMAGE_OPTIMIZER: "1"

    steps:
      - name: Check out the exact validated preproduction revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-preprod.outputs.source_sha }}

      - name: Load the validated preproduction snapshot
        uses: actions/download-artifact@v4
        with:
          name: validated-preproduction-snapshot
          path: ${{ runner.temp }}/validated-preproduction-snapshot
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate-preprod.outputs.preprod_run_id }}

      - name: Restore the validated preproduction snapshot
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/validated-preproduction-snapshot/validated-preproduction-snapshot.tar"
          test -s "$snapshot"
          rm -rf \
            data/notion \
            assets/img/drive-library \
            assets/img/riders \
            assets/img/riders-action \
            assets/img/equipment \
            assets/img/brands \
            assets/img/competitions \
            assets/img/teams
          tar -xf "$snapshot" -C "$GITHUB_WORKSPACE"

      - name: Validate the production inputs
        run: |
          set -euo pipefail
          python3 scripts/validate_rider_snapshot.py data/notion/riders.json
          python3 tests/notion_only_source.py
          python3 tests/workflow_contract.py
          test -s data/drive/live-image-manifest.json
          test -s data/drive/live-images-version.txt
          test -s data/drive-logo-manifest.json
          test -s data/deployment-health.json
          python3 scripts/deployment_health.py create \
            --riders data/notion/riders.json \
            --drive-manifest data/drive/live-image-manifest.json \
            --public-image-path assets/img/riders \
            --public-image-path assets/img/riders-action \
            --public-image-path assets/img/equipment \
            --public-image-path assets/img/brands \
            --public-image-path assets/img/competitions \
            --public-image-path assets/img/teams \
            --output "$RUNNER_TEMP/recomputed-deployment-health.json"
          cmp data/deployment-health.json "$RUNNER_TEMP/recomputed-deployment-health.json"
          python3 tests/deployment_health.py
          test "$(python3 scripts/image_snapshot_hash.py assets/img/drive-library assets/img/riders assets/img/riders-action assets/img/equipment assets/img/brands assets/img/competitions assets/img/teams)" = \
            "$(cat data/drive/live-images-version.txt)"

      - name: Build and verify production
        run: |
          set -euo pipefail
          python3 build.py
          python3 tests/environment_visibility.py
          ! grep -q 'preprod-source-switcher' index.html
          ! grep -q 'Google Sheets' index.html

          test -f competitions/redbull-2026.html
          test -f competitions/redbull-2026/rounds/cerroabajo-2026.html
          test -f competitions/redbull-2026/rounds/rampage-2026.html
          test -f competitions/redbull-2026/rounds/hardline-2026.html
          grep -q 'Red Bull</h2>' competitions.html

          test -f competitions/project-17.html
          test -f competitions/project-17/riders.html
          grep -q 'Project 17' competitions.html
          grep -q 'data-rider-grid' competitions/project-17/riders.html

          test -f competitions/beyondgravity.html
          test -f competitions/beyondgravity/riders.html
          test -f assets/img/competitions/beyondgravity.jpg
          test -f assets/img/competitions/uci-mtb-world-cup-dh-2026.png
          grep -q 'Beyond Gravity 2027 at Maydena Bike Park' competitions/beyondgravity.html
          grep -q 'Beyond Gravity</h1>' competitions/beyondgravity.html
          grep -q 'competition-status competition-status-soon' competitions.html
          grep -q 'assets/img/competitions/uci-mtb-world-cup-dh-2026.png' competitions.html
          grep -q '<loc>https://ridersfanatics.com/competitions/beyondgravity.html</loc>' sitemap.xml

          test -f competitions/uci-mtb-world-cup-dh-2026.html
          test -f competitions/uci-mtb-world-cup-dh-2026/standings.html
          test -f competitions/uci-mtb-world-cup-dh-2026/rounds/les-gets.html
          test -f competitions/uci-mtb-world-cup-dh-2026/rounds/whistler.html
          grep -q 'UCI World Series 2026 Standings' competitions/uci-mtb-world-cup-dh-2026/standings.html

          test -f riders/descalzo-facundo.html
          grep -q 'Jackson Goldstone Bike Check 2026' riders/jackson-goldstone.html

      - name: Prepare public site files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public"
          deploy/publish-static.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/public" production
          cp data/notion/sync-metadata.json "$RUNNER_TEMP/public/notion-sync-metadata.json"
          python3 -c 'import hashlib, pathlib; h=hashlib.sha256(); [h.update(pathlib.Path(p).read_bytes()) for p in ("data/notion/riders.json", "data/notion/competitions.json")]; print(h.hexdigest())' \
            > "$RUNNER_TEMP/public/notion-data-version.txt"
          cp data/drive/live-images-version.txt "$RUNNER_TEMP/public/drive-images-version.txt"
          cp data/deployment-health.json "$RUNNER_TEMP/public/deployment-health.json"

          test -s "$RUNNER_TEMP/public/notion-sync-metadata.json"
          test -s "$RUNNER_TEMP/public/notion-data-version.txt"
          test -s "$RUNNER_TEMP/public/drive-images-version.txt"
          test -s "$RUNNER_TEMP/public/deployment-health.json"
          test -f "$RUNNER_TEMP/public/index.html"
          test -f "$RUNNER_TEMP/public/riders.html"
          ! test -d "$RUNNER_TEMP/public/.git"
          ! test -d "$RUNNER_TEMP/public/tests"
          ! test -d "$RUNNER_TEMP/public/scripts"

      - name: Enforce production volume guard
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/current-production-health.json"
          if ! curl --fail --silent --show-error --retry 3 \
            "https://ridersfanatics.com/deployment-health.json?run=$GITHUB_RUN_ID" \
            --output "$baseline"; then
            rm -f "$baseline"
          fi
          python3 scripts/deployment_health.py validate \
            --candidate data/deployment-health.json \
            --baseline "$baseline" \
            --min-riders 300 \
            --min-results 750 \
            --min-images 1200 \
            --min-published-images 1500 \
            --max-rider-drop 5 \
            --max-result-drop 10 \
            --max-image-drop 10 \
            --max-published-image-drop 10

      - name: Install SFTP publishing client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Prepare content-addressed upload delta
        id: delta
        run: |
          set -euo pipefail
          remote_manifest="$RUNNER_TEMP/remote-deployment-manifest.json"
          if ! curl --fail --silent --show-error \
            "https://ridersfanatics.com/deployment-manifest.json?run=$GITHUB_RUN_ID" \
            --output "$remote_manifest"; then
            printf '{"version":1,"files":{}}\n' > "$remote_manifest"
          fi
          python3 deploy/prepare-delta.py \
            --public "$RUNNER_TEMP/public" \
            --remote-manifest "$remote_manifest" \
            --delta "$RUNNER_TEMP/upload-delta" \
            --delete-script "$RUNNER_TEMP/delete-remote.lftp" \
            --github-output "$GITHUB_OUTPUT"
          python3 tests/deployment_delta.py

      - name: Publish only to the OVH production directory
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_REMOTE_DIR: ${{ secrets.OVH_REMOTE_DIR }}
        run: |
          set -euo pipefail
          case "$OVH_REMOTE_DIR" in
            /home/ridersi/www|/home/ridersi/www/) ;;
            *) echo "Unsafe production directory: $OVH_REMOTE_DIR" >&2; exit 2 ;;
          esac
          test -n "$OVH_SFTP_HOST" && test -n "$OVH_SFTP_PORT"
          test -n "$OVH_SFTP_USER" && test -n "$OVH_SFTP_PASSWORD"
          lftp -u "$OVH_SFTP_USER,$OVH_SFTP_PASSWORD" \
            "sftp://$OVH_SFTP_HOST:$OVH_SFTP_PORT" <<LFTP
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 20
          cd "$OVH_REMOTE_DIR"
          mirror --reverse --parallel=4 --verbose "$RUNNER_TEMP/upload-delta" .
          source "$RUNNER_TEMP/delete-remote.lftp"
          put "$RUNNER_TEMP/public/deployment-manifest.json" -o deployment-manifest.json
          bye
          LFTP

      - name: Verify production
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://ridersfanatics.com/ > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://ridersfanatics.com/assets/i18n/fr.json > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://ridersfanatics.com/notion-data-version.txt > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://ridersfanatics.com/drive-images-version.txt > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            "https://ridersfanatics.com/deployment-health.json?run=$GITHUB_RUN_ID" | grep -q '"riders"'
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            "https://ridersfanatics.com/deployment-manifest.json?run=$GITHUB_RUN_ID" | grep -q '"version":1'
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://ridersfanatics.com/notion-sync-metadata.json | grep -q '"sha256"'
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://ridersfanatics.com/competitions/project-17.html > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://ridersfanatics.com/competitions/project-17/riders.html > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://ridersfanatics.com/competitions/uci-mtb-world-cup-dh-2026/rounds/les-gets.html > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://ridersfanatics.com/competitions/uci-mtb-world-cup-dh-2026/rounds/whistler.html > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://ridersfanatics.com/competitions/beyondgravity.html | grep -q 'Beyond Gravity 2027 at Maydena Bike Park'
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://ridersfanatics.com/assets/img/competitions/beyondgravity.jpg > /dev/null
          test "$(curl --silent --location --output /dev/null --write-out '%{http_code} %{url_effective}' \
            https://ridersfanatics.com/competitions/uci/ | sed 's/:443\//\//')" = \
            '200 https://ridersfanatics.com/competitions/uci-mtb-world-cup-dh-2026.html'
          test "$(curl --silent --location --output /dev/null --write-out '%{http_code} %{url_effective}' \
            https://ridersfanatics.com/riders/facundo-descalzo.html | sed 's/:443\//\//')" = \
            '200 https://ridersfanatics.com/riders/descalzo-facundo.html'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://ridersfanatics.com/riders/frida-helena-rooning.html)" = "301"
          curl --silent --show-error --head https://ridersfanatics.com/ | grep -qi '^strict-transport-security:'

      - name: Package the verified production rollback snapshot
        run: |
          set -euo pipefail
          rollback="$RUNNER_TEMP/production-rollback"
          mkdir -p "$rollback"
          tar -cf "$rollback/public-site.tar" -C "$RUNNER_TEMP/public" .
          cp data/deployment-health.json "$rollback/deployment-health.json"
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'source_sha=%s\n' "${{ needs.validate-preprod.outputs.source_sha }}"
            printf 'created_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'archive_sha256=%s\n' "$(sha256sum "$rollback/public-site.tar" | cut -d' ' -f1)"
          } > "$rollback/rollback-metadata.txt"
          test -s "$rollback/public-site.tar"
          test -s "$rollback/rollback-metadata.txt"

      - name: Keep the verified production snapshot for rollback
        uses: actions/upload-artifact@v4
        with:
          name: production-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/production-rollback/
          retention-days: 30
          compression-level: 0
